  <path d="M326 148L340 160L326 172" stroke="url(#g)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M584 160H642" stroke="url(#g)" stroke-width="5" stroke-linecap="round"/>
  <path d="M634 148L648 160L634 172" stroke="url(#g)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="306" y="252" width="308" height="34" rx="17" fill="#ECFEFF" stroke="#A5F3FC"/>
  <text x="460" y="274" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui" font-size="13" font-weight="600" fill="#0F5C7A">One memory layer across every agent</text>

<svg width="920" height="300" viewBox="0 0 920 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">mnemo architecture flow</title>
  <desc id="desc">Agents connect to mnemo through hooks, MCP and skills; memory stays in local SQLite</desc>

  <rect width="920" height="300" fill="#f0f4f8"/>
  <rect x="0.5" y="0.5" width="919" height="299" stroke="#c4d0de" stroke-width="1"/>

  <text x="40" y="36" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="11" letter-spacing="0.16em" fill="#4a6080">ARCHITECTURE / ONE MEMORY LAYER</text>
  <line x1="40" y1="48" x2="880" y2="48" stroke="#c4d0de" stroke-width="1"/>

  <!-- panel: agents -->
  <rect x="40" y="72" width="240" height="160" fill="#e2eaf2" stroke="#0f1f38" stroke-width="1"/>
  <rect x="40" y="72" width="240" height="32" fill="#0f1f38"/>
  <text x="160" y="93" text-anchor="middle" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#f0f4f8">AI coding agents</text>
  <text x="160" y="132" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="13" fill="#0f1f38">Claude Code</text>
  <text x="160" y="156" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="13" fill="#0f1f38">Codex Â| Cursor</text>
  <text x="160" y="180" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="13" fill="#0f1f38">OpenCode Â| Pi</text>
  <text x="160" y="210" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="11" fill="#4a6080">hooks Â| MCP Â| skills</text>

  <!-- arrow -->
  <line x1="296" y1="152" x2="348" y2="152" stroke="#0f1f38" stroke-width="1.5"/>
  <polyline points="340,144 352,152 340,160" fill="none" stroke="#0f1f38" stroke-width="1.5"/>

  <!-- panel: mnemo -->
  <rect x="360" y="72" width="240" height="160" fill="#f0f4f8" stroke="#0f1f38" stroke-width="1"/>
  <rect x="360" y="72" width="240" height="32" fill="#0f1f38"/>
  <text x="480" y="93" text-anchor="middle" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#f0f4f8">mnemo</text>
  <text x="480" y="132" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="13" fill="#0f1f38">event controller</text>
  <text x="480" y="156" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="13" fill="#0f1f38">MCP tools</text>
  <text x="480" y="180" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="13" fill="#0f1f38">portable skills</text>
  <text x="480" y="210" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="11" fill="#4a6080">sole SQLite writer</text>

  <!-- arrow -->
  <line x1="616" y1="152" x2="668" y2="152" stroke="#0f1f38" stroke-width="1.5"/>
  <polyline points="660,144 672,152 660,160" fill="none" stroke="#0f1f38" stroke-width="1.5"/>

  <!-- panel: memory -->
  <rect x="680" y="72" width="200" height="160" fill="#e2eaf2" stroke="#0f1f38" stroke-width="1"/>
  <rect x="680" y="72" width="200" height="32" fill="#0f1f38"/>
  <text x="780" y="93" text-anchor="middle" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#f0f4f8">Local memory</text>
  <text x="780" y="132" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="13" fill="#0f1f38">SQLite + FTS5</text>
  <text x="780" y="156" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="13" fill="#0f1f38">project-scoped</text>
  <text x="780" y="180" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="13" fill="#0f1f38">offline-first</text>
  <text x="780" y="210" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="11" fill="#4a6080">~/.mnemo</text>

  <rect x="40" y="252" width="840" height="28" fill="#0f1f38"/>
  <text x="460" y="271" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="12" letter-spacing="0.08em" fill="#f0f4f8">ONE MEMORY AUTHORITY ACROSS EVERY SUPPORTED AGENT</text>
</svg>

<svg width="920" height="320" viewBox="0 0 920 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">mnemo terminal demo</title>
  <desc id="desc">A terminal window showing mnemo init, doctor, and context commands.</desc>
  <rect width="920" height="320" rx="28" fill="#F8FAFC"/>
  <defs>
    <linearGradient id="g" x1="70" y1="44" x2="850" y2="276" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F5C7A"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="46" y="50" width="828" height="220" rx="22" fill="#0F172A" stroke="#E2E8F0"/>
    <rect x="46" y="50" width="828" height="42" rx="22" fill="#1E293B"/>
    <path d="M46 72H874" stroke="#334155"/>
    <circle cx="74" cy="71" r="6" fill="#EF4444"/>
    <circle cx="96" cy="71" r="6" fill="#F59E0B"/>
    <circle cx="118" cy="71" r="6" fill="#22C55E"/>
    <text x="460" y="77" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" fill="#94A3B8">~/project</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="17">
    <text x="76" y="124" fill="#67E8F9">$ mnemo init --agent=all</text>
    <text x="96" y="150" fill="#A7F3D0">✓ project activated with .mnemo</text>

    <text x="76" y="184" fill="#67E8F9">$ mnemo doctor --agent=all --path=.</text>
    <text x="96" y="210" fill="#A7F3D0">status: ok · MCP · hooks · instructions · store</text>

    <text x="76" y="244" fill="#67E8F9">$ mnemo context myapp</text>
    <text x="96" y="270" fill="#E2E8F0">recalls decisions from previous sessions</text>
  </g>

</svg>

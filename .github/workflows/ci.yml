name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify sqlc generated code
        if: runner.os == 'Linux'
        run: |
          go tool sqlc generate
          git diff --exit-code -- internal/db/generated

      - name: Reject runtime SQL construction
        if: runner.os == 'Linux'
        run: |
          if grep -R -n -E '(^|[[:space:]])(query|q|sql)[[:space:]]*(\+=|(:=|=)[^;]*\+)' internal/store --include='*.go'; then
            echo "runtime SQL concatenation is forbidden; add a sqlc query instead"
            exit 1
          fi

      - name: Verify module boundaries
        if: runner.os == 'Linux'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          if git grep -n -E 'github.com/jmeiracorbal/mnemo-(adapters|events)' -- '*.go' go.mod go.sum README.md README.es.md README.zh-CN.md; then
            echo "obsolete Mnemo module dependency detected"
            exit 1
          fi

      - name: Validate installer syntax
        run: bash -n install.sh

      - name: Verify transactional installer and rollback
        run: bash tests/install_upgrade_test.sh

      - name: Test
        run: go test ./...

      - name: Race test
        if: runner.os == 'Linux'
        run: go test -race ./...

      - name: Build
        run: go build ./...

  native-service:
    name: Native service (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Prepare systemd user manager
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"

      - name: Check out previous release
        uses: actions/checkout@v4
        with:
          ref: main
          path: previous

      - name: Build actual previous and new executables
        run: |
          go build -o "$RUNNER_TEMP/mnemo-new" ./cmd/mnemo
          (cd previous && go build -o "$RUNNER_TEMP/mnemo-old" ./cmd/mnemo)

      - name: Verify real launchd/systemd upgrade and rollback
        env:
          MNEMO_NATIVE_SERVICE_E2E: "1"
          MNEMO_NATIVE_OLD_BIN: ${{ runner.temp }}/mnemo-old
          MNEMO_NATIVE_NEW_BIN: ${{ runner.temp }}/mnemo-new
        run: go test -v -timeout 5m ./cmd/mnemo -run '^TestNativeServiceUpgradeRollback$' -count=1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0

      - name: Lint
        run: golangci-lint run ./...

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Run govulncheck
        run: govulncheck -scan symbol ./...
        working-directory: cmd/mnemo
